name: Repository quality

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EAS_TOOLS_TABS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The voice packages are ~1.4 GB of LFS; the e2e suite only needs eSpeak's.
      - name: Fetch eSpeak data from LFS
        run: git lfs pull --include="assets/wasm_tts_voices/espeak/espeak-ng.eas.data"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache e2e build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/e2e-rs

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        env:
          EAS_TOOLS_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: make quality
