name: Repository quality

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Restore-only: the e2e job warms and saves this cache with the same check, clippy and
      # llvm-cov builds that `make checks` runs, so both jobs never race to save one key.
      - name: Restore e2e build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('test/e2e-rs/Cargo.lock', 'test/e2e-rs/src/**', 'test/e2e-rs/suites/**') }}
          restore-keys: |
            e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        run: make checks

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EAS_TOOLS_TABS: "4"
      E2E_RUNNER: container
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The voice packages are ~1.4 GB of LFS; the e2e suite only needs eSpeak's.
      - name: Fetch eSpeak data from LFS
        run: git lfs pull --include="assets/wasm_tts_voices/espeak/espeak-ng.eas.data"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Restored and saved explicitly: post-step caches (rust-cache, setup-node) only save
      # when the whole job succeeds, so a failing test run never wrote one.
      - name: Restore e2e build cache
        id: e2e-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('test/e2e-rs/Cargo.lock', 'test/e2e-rs/src/**', 'test/e2e-rs/suites/**') }}
          restore-keys: |
            e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      # check, clippy and llvm-cov each keep their own artifacts, separate from a test build;
      # warm every flavour `make e2e` uses so the saved cache covers all of them.
      - name: Build e2e suite
        run: |
          cargo check --manifest-path test/e2e-rs/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path test/e2e-rs/Cargo.toml --all-targets --locked
          cargo llvm-cov --manifest-path test/e2e-rs/Cargo.toml --lib --locked --no-report
          cargo test --manifest-path test/e2e-rs/Cargo.toml --test e2e --no-run

      - name: Save e2e build cache
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: ${{ steps.e2e-cache.outputs.cache-primary-key }}

      - name: Run e2e suite
        run: make e2e
